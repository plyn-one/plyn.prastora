["apisańnie"]
"uvachod" = "plyn.prastora: the web layout framework of Plyń, made first for agents: plain HTML and CSS in which a page keeps its composition across screens, with a closed vocabulary an agent reads whole and a check that renders a page and tells the agent what broke."
"kirunak" = "A framework an agent lays pages out with on its first or second try: proportional scaling within a few regimes, as A-Rozum/prastora showed, joined with a closed vocabulary of relations that works at every scale, a manifest that fits in an agent's context, and a check by rendering. Made anew: A-Rozum/prastora and the prototype at plyn-css-proto.pages.dev are sources, not material moved here."

["samaadrasavańnie"]
"file:AGENTS.md" = "the orientation of this place, written by plyn.dojlid"
"file:miesca.toml" = "the registry of this place: the answers of its constituents"
"file:śled.toml" = "the work of this place, one zapis per krok"
"dir:pračytańnie" = "the readings of this place, one file per language"
"file:pračytańnie/en.toml" = "the readings of this place in English"
"file:core.css" = "the core stylesheet, built by variants.mjs: three frames, each a canvas of fixed units and columns that scales as a whole, with margins beyond it; plain HTML styled and the relations"
"file:MANIFEST.md" = "the manifest for agents: the whole vocabulary, its rules and patterns, read before laying a page out"
"file:check.mjs" = "the check of a page by rendering: both edges of every frame in both colour schemes, and whether anything moved on the canvas within a frame"
"dir:demo" = "pages laid out with the core, which the check passes"
"file:demo/index.html" = "the demonstration page: a picture bound to the heading and reaching into the next band, columns of the canvas"
"dir:src" = "the sources the core is built from"
"file:src/base.css" = "the part of the core that does not depend on frames: tokens, plain HTML styled, relations, surfaces, tones"
"file:variants.mjs" = "builds core.css from the frames of a variant, and a lab page for each variant, to be looked at by resizing or zooming the window"
"dir:lab" = "the lab: variants of frames compared on the same page"
"file:lab/variants.json" = "the variants of frames: where each frame begins, its units and columns, and how its canvas follows the window"

["apisańnie"]
"uvachod" = "plyn.prastora: the web page layout framework of Plyń, made first for agents. A page is laid out the way a picture is composed: for each class of screen (a frame: phone, landscape screen, wide screen, and print on A4) its layout is set once on a canvas of fixed units and columns, and within the frame the whole layout scales with the window, so every element keeps its place against every other. Plain HTML and CSS, a manifest an agent reads in parts, and a check that renders a page in every frame and on paper and tells the agent what to fix."
"kirunak" = "Page layout an agent gets right on the first or second try and can prove: layout set per frame and scaling as a whole within it, as A-Rozum/prastora began, with a closed vocabulary of attributes, devices of print layout that fluid web layout could not hold (columns, initial letters, text round shapes, words placed on pictures, documents and blanks the same on screen and paper), and a check by rendering. Made anew: A-Rozum/prastora and the prototype at plyn-css-proto.pages.dev are sources, not material moved here."

["samaadrasavańnie"]
"file:AGENTS.md" = "the orientation of this place, written by plyn.dojlid"
"file:miesca.toml" = "the registry of this place: the answers of its constituents"
"file:śled.toml" = "the work of this place, one zapis per krok"
"dir:pračytańnie" = "the readings of this place, one file per language"
"file:pračytańnie/en.toml" = "the readings of this place in English"
"file:core.css" = "the core stylesheet, built by variants.mjs: three screen frames and a print frame, each a canvas of fixed units and columns that scales as a whole, with margins beyond it; plain HTML styled, the relations and the devices of print"
"file:MANIFEST.md" = "the manifest for agents, read before laying a page out: frames, the canvas, the relations, the common patterns, and which section of manifest/ to read for what"
"file:check.mjs" = "the rendering check: portrait and landscape in both schemes and A4; --extended checks every frame and scaling within it; real Tab traversal, resource failures and missing outlines; each problem with a fix"
"file:check.test.mjs" = "browser regressions: document-relative alpha resources, remote cores, real Tab traversal, radio groups, focus traps, positive tabindex and nested frames; cleanup and combined resource/keyboard failures in both modes; node --test check.test.mjs"
"dir:demo" = "pages laid out with the core, which the check passes"
"file:demo/index.html" = "the demonstration page: a picture bound to the heading and reaching into the next band, columns of the canvas"
"dir:src" = "the sources the core is built from"
"file:src/base.css" = "the part of the core that does not depend on frames: tokens, plain HTML styled, relations, surfaces, tones"
"file:variants.mjs" = "builds core.css from the frames of a variant, CONNECT.md and README.md from src/ with the version of the release, which lives in it only, the published tree site/ with a folder for each release tag written from that tag, and a lab page for each variant"
"dir:lab" = "the lab: variants of frames compared on the same page"
"file:lab/variants.json" = "the variants of frames: where each frame begins, its units and columns, and how its canvas follows the window"
"file:demo/longread.html" = "a longread laid out with devices of print: a cover with words on its picture, a headline set by hand, an initial letter, justified columns with a pulled quote, text round a shape, a picture reaching into the margin, a staggered dialogue"
"file:lab/prospects.md" = "notes for the owner on where layout as a picture may lead and why, what was found on the way, and fonts measured; not instructions for laying out a page"
"file:demo/document.html" = "a document in sheets the same on screen and on paper: numbered lines, clauses numbered through the sheets, notes in the margin at the lines they speak of"
"file:demo/pictures.html" = "words on pictures: labels on the parts of a drawing with lines drawn to them, text round the outline of an image, a comic with balloons of real text"
"dir:demo/art" = "pictures the demonstration pages use as files"
"file:demo/art/vase.svg" = "a vase, whose outline the text of demo/pictures.html runs round"
"file:demo/type.html" = "typography of print: headline lines filling their column exactly, columns and notes on one grid of lines, hanging quotes, paragraphs set in a circle and a diamond"
"file:demo/journey.html" = "composition across the page: a road drawn through the page past blocks set at its bends, drawn as the reader scrolls, and a book spread with a picture across the gutter"
"file:demo/blank.html" = "a blank like a paper form on a sheet: boxed letters, lines to write on, choices, filled in on screen and printed as the form with what was entered"
"file:CONNECT.md" = "for agents: how to connect Prastora to a project, by the release tag on a CDN, copied files or a submodule, and how to get and run the check"

name: Prastora browser check

# Fixed browser executor for the public Plyń repository: GitHub Actions + Playwright.
on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser regressions (core and optional modules when present)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prastora-reports
          node --test check.test.mjs 2>&1 | tee prastora-reports/core.tap
          if [[ -f modules/modules.test.mjs ]]; then
            node --test modules/modules.test.mjs 2>&1 | tee prastora-reports/modules.tap
          fi
      - name: Build checked release candidate
        run: |
          node release/package.mjs
          tar -czf prastora-release-v0.2.0-rc1.tar.gz prastora-release-v0.2.0-rc1/
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: prastora-v0.2.0-rc1-${{ github.sha }}
          path: prastora-release-v0.2.0-rc1.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prastora-browser-check
          path: prastora-reports/
          retention-days: 7
          if-no-files-found: warn

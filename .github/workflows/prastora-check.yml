name: Prastora browser check

# Fixed browser executor for the public Plyń repository: GitHub Actions + Playwright.
on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser regressions (core and optional modules when present)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prastora-reports
          node --test check.test.mjs 2>&1 | tee prastora-reports/core.tap
          if [[ -f modules/modules.test.mjs ]]; then
            node --test modules/modules.test.mjs 2>&1 | tee prastora-reports/modules.tap
          fi
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prastora-browser-check
          path: prastora-reports/
          retention-days: 7
          if-no-files-found: warn

  site-mode-diagnostic:
    name: site-mode-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Site-mode regression isolated
        run: node --test --test-name-pattern="site mode permits branded HTML" check.test.mjs

  core-diagnostic:
    name: core-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node --test check.test.mjs
  modules-diagnostic:
    name: modules-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node --test modules/modules.test.mjs

  core-groups-diagnostic:
    name: core-${{ matrix.group.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group:
          - { name: resources, pattern: 'stylesheet|relative-URL|CSS-only|alpha image' }
          - { name: urls, pattern: 'HTTP URL|remote core' }
          - { name: keyboard, pattern: 'keyboard:|keyboard traversal' }
          - { name: optional, pattern: 'missing optional|axe-core reports|real Nu' }
          - { name: minified, pattern: 'every minified core' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node --test --test-name-pattern="${{ matrix.group.pattern }}" check.test.mjs

  keyboard-cases-diagnostic:
    name: keyboard-${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [radio, positive, trap, frame, combo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node --test --test-name-pattern="keyboard: ${{ matrix.case }}," check.test.mjs

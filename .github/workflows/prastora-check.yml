name: Prastora browser check

# A spare check for an agent that cannot run Chromium where it works: started by hand (Actions, Run workflow);
# landing and publishing do not wait for it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check all work pages, all frames and A4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prastora-reports prastora-shots
          mapfile -d '' pages < <(find site/try -type f -name '*.html' -print0 | sort -z)
          if (("${#pages[@]}" == 0)); then
            echo "No work pages to verify" >&2
            exit 1
          fi
          for file in "${pages[@]}"; do
            name="${file//\//_}"
            node check.mjs "$file" --extended --shots "prastora-shots/$name" > "prastora-reports/$name.json"
          done
      - name: Upload verdict and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prastora-browser-check
          path: |
            prastora-reports/
            prastora-shots/
          retention-days: 1
          if-no-files-found: warn
